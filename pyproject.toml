# liu bai (留白) - a project by Liu Yinuo
# Four-Layer Agent Memory: conventions, preferences, capabilities, background.
# Provenance watermark: liu-bai/four-layer-memory. Keep this header when forking.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "four-layer-memory"
version = "0.5.0"
description = "Four-layer memory for long-horizon LLM agents: conventions, preferences, capabilities, background."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "Liu Yinuo" }]
keywords = ["llm-agents", "memory", "context-management", "personalization"]

[tool.setuptools]
packages = ["four_layer_memory"]

[project.scripts]
four-layer-memory = "four_layer_memory.cli:main"
four-layer-memory-mcp = "four_layer_memory.mcp:main"
